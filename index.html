<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新加坡五天四夜旅遊指南</title>
<style>
  :root {
    --teal: #008080;
    --teal-dark: #005f5f;
    --accent: #d9534f;
    --food: #e67e22;
    --info: #0275d8;
    --bg: #f4f7f6;
    --card: #ffffff;
    --text: #1f2d2d;
    --muted: #5f6f6f;
    --border: #dbe4e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header.hero {
    background:
      linear-gradient(180deg, rgba(0, 60, 60, .55), rgba(0, 40, 40, .85)),
      url("images/garden-rhapsody.jpg") center / cover;
    color: #fff;
    padding: clamp(3rem, 12vw, 6rem) 1rem 5rem;
    text-align: center;
  }
  header.hero .eyebrow { letter-spacing: .3em; font-size: .8rem; opacity: .85; margin: 0 0 .5rem; }
  header.hero h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 6vw, 3rem); text-shadow: 0 2px 12px rgba(0, 0, 0, .4); }
  header.hero p { margin: 0; opacity: .95; }
  header.hero .hero-meta { display: inline-flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1rem; }
  header.hero .hero-meta span {
    background: rgba(255, 255, 255, .18);
    backdrop-filter: blur(6px);
    padding: .2rem .8rem;
    border-radius: 999px;
    font-size: .85rem;
  }

  nav.day-tabs {
    position: sticky;
    top: .5rem;
    z-index: 10;
    background: rgba(255, 255, 255, .95);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .15);
    margin-top: -2.5rem;
    border-radius: 16px;
    max-width: 860px;
    margin-inline: 1rem;
  }
  @media (min-width: 900px) { nav.day-tabs { margin-inline: auto; } }
  [role="tablist"] {
    display: flex;
    overflow-x: auto;
    gap: .25rem;
    padding: .5rem;
    scrollbar-width: thin;
  }
  [role="tab"] {
    flex: 1 0 auto;
    min-width: 5.5rem;
    border: 0;
    background: transparent;
    padding: .5rem .75rem;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    transition: background .2s, color .2s;
  }
  [role="tab"]:hover { background: var(--bg); }
  [role="tab"] small { display: block; font-size: .72rem; }
  [role="tab"][aria-selected="true"] { background: var(--teal); color: #fff; font-weight: 600; box-shadow: 0 3px 10px rgba(0, 128, 128, .4); }
  [role="tab"]:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }

  .notes-collapse {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--teal);
    border-radius: 16px;
    margin-bottom: 1rem;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
  }
  .notes-collapse > summary {
    list-style: none;
    cursor: pointer;
    padding: .9rem 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .25rem .75rem;
  }
  .notes-collapse > summary::-webkit-details-marker { display: none; }
  .notes-collapse > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s; }
  .notes-collapse[open] > summary::after { transform: rotate(180deg); }
  .notes-collapse > summary:focus-visible { outline: 3px solid var(--info); outline-offset: -3px; }
  .notes-title { font-weight: 700; font-size: 1.1rem; }
  .notes-body { padding: 0 1rem 1rem; }
  .notes-collapse > .notice-body { padding: 0 1rem 1rem; }
  .notice-lead { color: var(--accent); font-size: .9rem; font-weight: 600; }
  .notice-body { display: grid; gap: .75rem; }
  .notice-body p { margin: 0; }
  .notice-body ol { margin: 0; padding-left: 1.2rem; }
  .notice-body a { color: var(--info); }
  .notice-source { font-size: .8rem; color: var(--muted); }

  .notes-intro { margin: 0 0 .6rem; color: var(--muted); font-size: .9rem; }
  .check-list, .plain-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  ol.plain-list { list-style: decimal; padding-left: 1.2rem; }
  .check-list label { display: flex; gap: .6rem; align-items: flex-start; cursor: pointer; }
  .check-list input { margin-top: .35rem; width: 1.1rem; height: 1.1rem; flex: none; accent-color: var(--teal); }
  .check-list input:checked + span { color: var(--muted); text-decoration: line-through; }
  .check-list input:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
  .item-label { font-weight: 600; }
  .item-detail { display: block; font-size: .92rem; }
  .notes-callout { margin: .6rem 0 0; padding: .5rem .75rem; border-radius: 8px; background: #fff7e6; font-size: .9rem; }

  main { max-width: 860px; margin: 0 auto; padding: 1rem; }
  .day-cover {
    position: relative;
    min-height: 200px;
    margin: .5rem 0 1.25rem;
    padding: 1.25rem;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    color: #fff;
    background: var(--teal-dark) center / cover;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    overflow: hidden;
  }
  .day-cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 20%, rgba(0, 0, 0, .7));
  }
  .day-cover > * { position: relative; }
  .day-title { margin: 0; font-size: clamp(1.3rem, 4.5vw, 1.8rem); text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
  .day-date { margin: .25rem 0 0; opacity: .9; }

  .segment {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--teal);
    border-radius: 16px;
    margin-bottom: 1rem;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
    transition: box-shadow .2s;
  }
  .segment[open] { box-shadow: 0 8px 24px rgba(0, 0, 0, .1); }
  .segment > summary {
    list-style: none;
    cursor: pointer;
    padding: .9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  .segment > summary::-webkit-details-marker { display: none; }
  .segment > summary:focus-visible { outline: 3px solid var(--info); outline-offset: -3px; }
  .seg-time { font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
  .seg-title { font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; gap: .5rem; }
  .seg-title::after { content: "▾"; color: var(--muted); transition: transform .2s; }
  .segment[open] .seg-title::after { transform: rotate(180deg); }
  .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
  .tag {
    font-size: .75rem;
    padding: .1rem .55rem;
    border-radius: 999px;
    border: 1px solid currentColor;
    font-weight: 600;
  }
  .tag.indoor { color: var(--info); }
  .tag.outdoor { color: #2e8b57; }
  .tag.mixed { color: #8a6d00; }
  .tag.booking { color: #fff; background: var(--accent); border-color: var(--accent); }

  .seg-body { padding: 0 1rem 1rem; display: grid; gap: .75rem; }
  .info-card { border-radius: 10px; padding: .7rem .9rem; background: var(--bg); border-left: 4px solid var(--teal); }
  .info-card h4 { margin: 0 0 .35rem; font-size: .95rem; }
  .info-card ul { margin: 0; padding-left: 1.2rem; }
  .info-card.attraction { background: transparent; padding: 0; border-left: 0; }
  .info-card.attraction h4 { margin-bottom: .6rem; }
  .info-card.attraction ul {
    list-style: none;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: .75rem;
  }
  .place-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    padding: 0 0 .75rem;
    transition: transform .2s, box-shadow .2s;
  }
  .place-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .12); }
  .place-card:has(.map-frame:not([hidden])) { grid-column: 1 / -1; }
  .place-card > :not(.place-photo) { margin-inline: .75rem; }
  .place-photo { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--border); margin-bottom: .6rem; }
  .place-text { display: block; font-weight: 500; }
  .map-link {
    display: inline-block;
    margin: .25rem .5rem 0 0;
    padding: .15rem .6rem;
    border-radius: 999px;
    background: var(--info);
    color: #fff;
    font-size: .8rem;
    text-decoration: none;
  }
  button.map-link { border: 0; font-family: inherit; cursor: pointer; }
  .map-open { background: var(--teal); }
  .map-open:hover { background: var(--teal-dark); }
  .map-frame { margin-top: .5rem; }
  .map-frame iframe {
    width: 100%;
    height: 280px;
    border: 0;
    border-radius: 10px;
    background: var(--border);
  }
  .map-link:hover { background: #025aa5; }
  .map-link:focus-visible { outline: 3px solid var(--food); outline-offset: 2px; }
  .info-card.transport li { margin-bottom: .4rem; }
  .info-card.transport { border-color: var(--info); }
  .info-card.transport h4 { color: var(--info); }
  .info-card.attraction { border-color: var(--teal); }
  .info-card.attraction h4 { color: var(--teal-dark); }
  .info-card.notice-card { border-color: var(--teal); }
  .info-card.notice-card h4 { color: var(--teal-dark); }
  .info-card.food { border-color: var(--food); }
  .info-card.food h4 { color: var(--food); }
  .info-card.rain { border-color: var(--accent); background: #fdf1f0; }
  .info-card.rain h4 { color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 1.5rem 1rem 2.5rem; }
  .credits { max-width: 860px; margin: 0 auto; padding: 0 1rem 2rem; font-size: .8rem; color: var(--muted); }
  .credits summary { cursor: pointer; }
  .credits ul { padding-left: 1.2rem; }
  .credits a { color: var(--info); }
  @media (min-width: 720px) {
    .segment > summary { flex-direction: row; align-items: center; gap: 1rem; }
    .seg-time { min-width: 9.5rem; }
    .seg-title { flex: 1; }
    .tags { justify-content: flex-end; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header class="hero">

  <div class="hero-meta">
    <span>✈️ 台北 TPE ⇄ 新加坡 SIN</span>
    <span>🏨 Hotel Jen Orchardgateway</span>
  </div>
</header>

<nav class="day-tabs" aria-label="行程天數、注意事項與必買清單">

<template id="notes-template">

    <summary>
      <span class="notes-title">🛂 入境須知</span>

    </section>

    <section class="info-card transport">

        <li>App：MyICA Mobile (iOS / Android)</li>
        <li>費用：完全免費；請只使用官方入口，避免誤入收費的代辦網站</li>
      </ul>
    </section>

    <section class="info-card notice-card">
      <h4>🇹🇼 台灣護照</h4>
      <ul>
        <li>免簽 30 天（本行程 5 天）</li>
        <li>護照效期需超過 6 個月：9/24 入境，效期須晚於 <strong>2027/03/24</strong></li>
        <li>可使用自動通關機 (ACI)，按下護照做生物辨識</li>
      </ul>
    </section>

    <section class="info-card notice-card">
      <h4>📝 必填欄位</h4>
      <ul>
        <li><strong>個人資料</strong>：護照掃描或手動輸入、居住地與國家代碼、手機號碼、電子信箱</li>
        <li><strong>行程</strong>：入境與離境日期、抵達方式 (空運)、航班號碼與航空公司、旅行目的 (度假)、新加坡住宿地址 (Hotel Jen Orchardgateway)、抵達與離境前的城市 (台北)</li>
        <li><strong>健康與經歷聲明</strong>：是否曾用其他護照入境新加坡、目前是否有感冒症狀、近 6 天是否造訪特定非洲或拉丁美洲國家</li>
      </ul>
    </section>

    <section class="info-card transport">
      <h4>🛃 入境流程</h4>
      <ol>
        <li>出發前完成線上申報</li>
        <li>持護照進入移民檢查區，使用自動通關機台</li>
        <li>領取行李，通過海關檢查</li>
        <li>之後到 Jewel Changi 1 樓寄放行李 (見 Day 1)</li>
      </ol>
    </section>

    <section class="info-card food">
      <h4>🚫 禁止與限制物品</h4>
      <ul>
        <li>口香糖、電子菸、違禁藥品，一律不要攜帶</li>
        <li>菸酒有免稅額度限制，超量須課稅</li>
        <li>現金超過門檻須申報，可在 App 線上填寫；門檻約 S$20,000，請以官方公告為準</li>
      </ul>
    </section>

    <p class="notice-source">
      資料來源：<a href="https://panpanlife.com/sgac/" target="_blank" rel="noopener noreferrer">panpanlife.com/sgac</a>。
      規定可能變動，出發前請至 <a href="https://www.ica.gov.sg/" target="_blank" rel="noopener noreferrer">新加坡移民與關卡局 (ICA)</a> 確認。
    </p>
  </div>
  </details>
</template>

const settingLabels = { indoor: "室內", outdoor: "戶外", mixed: "室內 + 戶外" };

/** 建立元素的小工具，避免手動拼接 HTML 字串。 */
function createElement(tagName, className, text) {
  const element = document.createElement(tagName);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

const travelModeLabels = { transit: "大眾運輸", driving: "開車 / 計程車", walking: "步行" };

function buildDirectionsUrl(route) {
  const params = new URLSearchParams({
    api: "1",
    origin: route.from,
    destination: route.to,
    travelmode: route.mode,
  });
  return `https://www.google.com/maps/dir/?${params.toString()}`;
}

function buildEmbedUrl(place) {
  return `https://www.google.com/maps?q=${encodeURIComponent(place)}&output=embed`;
}

function buildPlaceUrl(place) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`;
}

/** 景點：按鈕點擊後才載入並展開內嵌地圖，避免一次載入大量 iframe。 */
function fillPlaceItem(container, item) {
  container.classList.add("place-card");
  if (item.photo) {
    const photo = createElement("img", "place-photo");
    photo.src = `images/${item.photo}.jpg`;
    photo.alt = item.text;
    photo.loading = "lazy";
    photo.addEventListener("error", () => photo.remove());
    container.appendChild(photo);
  }
  container.appendChild(createElement("span", "place-text", item.text));

  const toggleButton = createElement("button", "map-link map-toggle", "📍 顯示地圖");
  toggleButton.type = "button";
  toggleButton.setAttribute("aria-expanded", "false");

  const openLink = createElement("a", "map-link map-open", "↗ 在 Google 地圖開啟");
  openLink.href = buildPlaceUrl(item.place);
  openLink.target = "_blank";
  openLink.rel = "noopener noreferrer";

  const mapFrameWrapper = createElement("div", "map-frame");
  mapFrameWrapper.hidden = true;

  toggleButton.addEventListener("click", () => {
    const willOpen = mapFrameWrapper.hidden;
    if (willOpen && !mapFrameWrapper.firstChild) {
      const frame = document.createElement("iframe");
      frame.src = buildEmbedUrl(item.place);
      frame.title = `Google 地圖：${item.place}`;
      frame.loading = "lazy";
      frame.referrerPolicy = "no-referrer-when-downgrade";
      frame.allowFullscreen = true;
      mapFrameWrapper.appendChild(frame);
    }
    mapFrameWrapper.hidden = !willOpen;
    toggleButton.setAttribute("aria-expanded", String(willOpen));
    toggleButton.textContent = willOpen ? "✕ 收合地圖" : "📍 顯示地圖";
  });

  container.append(toggleButton, openLink, mapFrameWrapper);
}

/** 填入一筆項目；景點附內嵌地圖，交通路線附 Google 地圖導航連結。 */
function fillItem(container, item) {
  if (typeof item === "string") {
    container.appendChild(document.createTextNode(item));
    return;
  }
  if (item.place) {
    fillPlaceItem(container, item);
    return;
  }
  container.appendChild(document.createTextNode(item.text));
  const link = createElement("a", "map-link", `🗺️ Google 地圖路線 (${travelModeLabels[item.mode]})`);
  link.href = buildDirectionsUrl(item);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  container.appendChild(link);
}

function createInfoCard(cssClass, heading, items) {
  const card = createElement("section", `info-card ${cssClass}`);
  card.appendChild(createElement("h4", "", heading));
  if (items.length === 1 && cssClass !== "attraction") {
    const block = createElement("div");
    fillItem(block, items[0]);
    card.appendChild(block);
  } else {
    const list = createElement("ul");
    items.forEach((item) => {
      const listItem = createElement("li");
      fillItem(listItem, item);
      list.appendChild(listItem);
    });
    card.appendChild(list);
  }
  return card;
}

function renderSegment(segment, isFirst) {
  const details = createElement("details", "segment");
  if (isFirst) details.open = true;

  const summary = createElement("summary");
  summary.appendChild(createElement("span", "seg-time", segment.time));
  summary.appendChild(createElement("span", "seg-title", segment.title));

  const tags = createElement("span", "tags");
  tags.appendChild(createElement("span", `tag ${segment.setting}`, settingLabels[segment.setting]));
  if (segment.booking) tags.appendChild(createElement("span", "tag booking", `⏰ ${segment.booking}`));
  summary.appendChild(tags);
  details.appendChild(summary);

  const body = createElement("div", "seg-body");
  if (segment.attractions) body.appendChild(createInfoCard("attraction", "🏛️ 景點介紹與亮點", segment.attractions));
  if (segment.transport) body.appendChild(createInfoCard("transport", "🚌 點對點交通指南", segment.transport));
  if (segment.food) body.appendChild(createInfoCard("food", "🍽️ 推薦在地美食與餐廳", segment.food));
  if (segment.rain) body.appendChild(createInfoCard("rain", "☔ 雨天備案", [segment.rain]));
  details.appendChild(body);
  return details;
}

const checklistStorageKey = "sg-trip-checklist";

function loadCheckedItems() {
  try {
    return new Set(JSON.parse(localStorage.getItem(checklistStorageKey) || "[]"));
  } catch {
    return new Set();
  }
}

function saveCheckedItems(checkedItems) {
  try {
    localStorage.setItem(checklistStorageKey, JSON.stringify([...checkedItems]));
  } catch {
    /* 私密模式或封鎖儲存時，勾選狀態只保留到重新整理 */
  }
}

function renderNoteItemText(item) {
  const text = createElement("span");
  text.appendChild(createElement("span", "item-label", item.label));
  if (item.detail) text.appendChild(createElement("span", "item-detail", item.detail));
  return text;
}

function renderNoteGroup(group, checkedItems) {
  const section = createElement("details", "notes-collapse");
  const summary = createElement("summary");
  summary.appendChild(createElement("span", "notes-title", group.heading));
  section.appendChild(summary);

  const body = createElement("div", "notes-body");
  if (group.intro) body.appendChild(createElement("p", "notes-intro", group.intro));

  const card = createElement("div", `info-card ${group.cardClass}`);
  const list = createElement(group.kind === "rules" ? "ol" : "ul", group.kind === "checklist" ? "check-list" : "plain-list");
  group.items.forEach((item) => {
    const listItem = createElement("li");
    if (group.kind === "checklist") {
      const label = createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      const key = `${group.heading}|${item.label}`;
      checkbox.checked = checkedItems.has(key);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) checkedItems.add(key);
        else checkedItems.delete(key);
        saveCheckedItems(checkedItems);
      });
      label.append(checkbox, renderNoteItemText(item));
      listItem.appendChild(label);
    } else {
      listItem.appendChild(renderNoteItemText(item));
    }
    list.appendChild(listItem);
  });
  card.appendChild(list);
  if (group.callout) card.appendChild(createElement("p", "notes-callout", group.callout));
  body.appendChild(card);
  section.appendChild(body);
  return section;
}

function renderNotes(container, groups) {
  const checkedItems = loadCheckedItems();
  groups.forEach((group) => container.appendChild(renderNoteGroup(group, checkedItems)));
}

const tablist = document.getElementById("tablist");

const notesIndex = days.length;

function createCover(imageName, title, subtitle) {
  const cover = createElement("div", "day-cover");
  cover.style.backgroundImage = `url("images/${imageName}.jpg")`;
  cover.appendChild(createElement("h2", "day-title", title));
  cover.appendChild(createElement("p", "day-date", subtitle));
  return cover;
}

function selectTab(index, moveFocus) {
  activeIndex = index;
  const tabs = tablist.querySelectorAll('[role="tab"]');
  tabs.forEach((tab, i) => {
    const selected = i === index;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
  });
  if (moveFocus) tabs[index].focus();
  tabs[index].scrollIntoView({ block: "nearest", inline: "center" });

  content.replaceChildren();
  content.setAttribute("role", "tabpanel");
  content.setAttribute("aria-labelledby", `tab-${index}`);

  if (index === notesIndex) {
    content.appendChild(createCover("merlion", "注意事項", "出發前請先確認"));
    content.appendChild(document.getElementById("notes-template").content.cloneNode(true));
    renderNotes(content, noteGroups);
    history.replaceState(null, "", "#notes");
    return;
  }

  if (index === foodIndex) {
    content.appendChild(createCover("merlion", "美食清單", "邊玩邊解鎖南洋美味"));
    renderNotes(content, foodChecklistGroups);
    history.replaceState(null, "", "#food");
    return;
  }

  if (index === mustBuyIndex) {
    content.appendChild(createCover("merlion", "必買清單", "伴手禮與在地好物"));
    renderNotes(content, mustBuyGroups);
    history.replaceState(null, "", "#buy");
    return;
  }

  const day = days[index];
  content.appendChild(createCover(day.cover, `${day.label}：${day.title}`, `📅 ${day.date}`));
  day.segments.forEach((segment, i) => content.appendChild(renderSegment(segment, i === 0)));
  history.replaceState(null, "", `#day${index + 1}`);
}

const tabLabels = [
  ...days.map((day) => ({ name: day.label, hint: day.date.slice(5, 10) })),
  { name: "注意事項", hint: "" },
  { name: "美食清單", hint: "" },
  { name: "必買清單", hint: "" },
];

tabLabels.forEach((label, index) => {
  const tab = createElement("button", "");
  tab.setAttribute("role", "tab");
  tab.id = `tab-${index}`;
  tab.appendChild(document.createTextNode(label.name));
  if (label.hint) tab.appendChild(createElement("small", "", label.hint));
  tab.addEventListener("click", () => selectTab(index, false));
  tab.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") selectTab((activeIndex + 1) % totalTabs, true);
    if (event.key === "ArrowLeft") selectTab((activeIndex - 1 + totalTabs) % totalTabs, true);
  });
  tablist.appendChild(tab);
});

const initialDay = /^#day([1-5])$/.exec(location.hash);
if (location.hash === "#notes") selectTab(notesIndex, false);
else if (location.hash === "#food") selectTab(foodIndex, false);
else if (location.hash === "#buy") selectTab(mustBuyIndex, false);
else selectTab(initialDay ? Number(initialDay[1]) - 1 : 0, false);
</script>
</body>
</html>
